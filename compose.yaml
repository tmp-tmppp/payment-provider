# The provider on its own, for local development of the payments service:
#   docker compose up -d --build
# The API is at http://localhost:8082 (the payment pages too), with the local key below. Webhooks go to the
# payments service running on the host at port 8083; change WEBHOOK_URL to the address of yours.
# The key and the secret below are local development values only; real ones live in the Secret payment-provider-env.
name: chance-payment-provider

services:
  payment-provider:
    build: .
    environment:
      APP_ENV: local
      PROVIDER_API_KEY: provider-local-api-key # hooks:allow local development only
      WEBHOOK_SECRET: provider-local-webhook-secret # hooks:allow local development only
      WEBHOOK_URL: http://host.docker.internal:8083/v1/webhooks/payment-provider
      PUBLIC_BASE_URL: http://localhost:8082
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8080"
    # The same hardening as in the cluster: read-only file system, no capabilities.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
