apiVersion: v1
kind: Service
metadata:
  name: {{ include "payment-provider.fullname" . }}
  labels:
    {{- include "payment-provider.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "payment-provider.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
