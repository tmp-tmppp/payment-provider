apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payment-provider.fullname" . }}
  labels:
    {{- include "payment-provider.labels" . | nindent 4 }}
spec:
  # Exactly one replica: the state is in memory, so a second Pod would hold other sessions (values.schema.json allows 1).
  replicas: {{ .Values.replicaCount }}
  # Recreate: the old Pod stops before the new one starts. A rolling update would run two Pods at once, and a payment
  # page opened on one of them would not find its session on the other.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "payment-provider.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payment-provider.selectorLabels" . | nindent 8 }}
      annotations:
        # A changed ConfigMap restarts the Pods (they read the environment only when they start).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Prometheus scrapes the metrics port of the Pod directly (the Service does not expose it).
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: payment-provider
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "payment-provider.fullname" . }}
            - secretRef:
                name: {{ .Values.existingSecret }}
                optional: true
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "payment-provider.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
