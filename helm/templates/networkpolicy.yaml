{{- if .Values.networkPolicy.enabled }}
# Who may reach the HTTP port: the API gateway (the payment page), the payments service (the API) and the smoke test Pod
# of this release. The gateway routes only the prefix /checkout; the API is for payments alone (it also needs the key).
# Only the monitoring namespace may reach the metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "payment-provider.fullname" . }}
  labels:
    {{- include "payment-provider.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "payment-provider.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayPodLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.paymentsPodLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: smoke-test
      ports:
        - port: http
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metrics.namespace | quote }}
      ports:
        - port: metrics
          protocol: TCP
{{- end }}
