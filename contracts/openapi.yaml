openapi: 3.1.0
info:
  title: Chance mock payment provider API
  version: 0.1.0
  description: |
    A stand-in for an external payment provider, deployed on its own, used by the payments service of Chance.
    It works like the test mode of a real provider: a merchant creates a **checkout session** (a payment that a
    buyer confirms on a payment page) or a **payout** (money sent to an account), and the provider tells the
    merchant what happened with a signed **webhook**.

    - Every `/v1` call needs `Authorization: Bearer <API key>`; there is one merchant and one key. The payment page
      (`/checkout/...`) is public, like a real provider's: whoever has the link can pay or decline.
    - `POST /v1/checkout-sessions` and `POST /v1/payouts` need an `Idempotency-Key` header. The same key with the
      same body returns the same object (`200` instead of `201`); the same key with another body is `409`. A key is
      remembered as long as its session or payout is kept.
    - Errors are RFC 9457 `application/problem+json`.
    - Webhooks are thin: they say what happened and to which object, nothing more. The receiver reads the object
      back through this API. They are described under `webhooks`; the signature scheme and a worked test vector
      are in `contracts/README.md`.
    - All state is in memory. A restart forgets every session, payout and event, and the number of stored sessions
      and payouts is capped (the oldest finished ones are dropped first). The payments service has to expire its
      own pending deposits.
    - Amounts are integers in cents (`1250` is 12.50 EUR), from 1 to 1 000 000. The only currency is `EUR`.
servers:
  - url: http://localhost:8080
    description: Local run
tags:
  - name: Checkout sessions
    description: Payments that a buyer confirms on the payment page
  - name: Payouts
    description: Money sent to an account
  - name: Test mode
    description: Switches for demos
  - name: Events
    description: Webhook events, for debugging
  - name: Payment page
    description: The public page of a checkout session (HTML)
  - name: Health
    description: Kubernetes probes
security:
  - apiKey: []

paths:
  /v1/checkout-sessions:
    post:
      tags: [Checkout sessions]
      operationId: createCheckoutSession
      summary: Create a checkout session
      description: |
        Creates an open session and returns it with the `url` of its payment page. The session expires after
        `CHECKOUT_TTL_MINUTES` (default 30). When the buyer pays or declines, or the time is up, the session ends
        and the event `checkout.session.completed`, `checkout.session.declined` or `checkout.session.expired`
        is sent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '200':
          description: The same Idempotency-Key and body came before; this is that session, in its state now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/AtCapacity'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/checkout-sessions/{id}:
    get:
      tags: [Checkout sessions]
      operationId: getCheckoutSession
      summary: Read a checkout session
      description: A session whose time is up is turned into `expired` by this read, with its event.
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '414':
          $ref: '#/components/responses/UriTooLong'

  /v1/payouts:
    post:
      tags: [Payouts]
      operationId: createPayout
      summary: Create a payout
      description: |
        Creates a `pending` payout. After `PAYOUT_DELAY_MS` (default 2000) it becomes `paid`, or `failed` with the
        reason `declined` when the test mode asks for declined payouts at that moment. Then the event
        `payout.paid` or `payout.failed` is sent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutRequest'
      responses:
        '201':
          description: Payout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '200':
          description: The same Idempotency-Key and body came before; this is that payout, in its state now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/AtCapacity'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/payouts/{id}:
    get:
      tags: [Payouts]
      operationId: getPayout
      summary: Read a payout
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: The payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '414':
          $ref: '#/components/responses/UriTooLong'

  /v1/test-mode:
    get:
      tags: [Test mode]
      operationId: getTestMode
      summary: Read the test mode
      responses:
        '200':
          description: The switches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMode'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Test mode]
      operationId: setTestMode
      summary: Change the test mode
      description: |
        With `declinePayouts` on, every payout that settles from now on fails with the reason `declined`
        (also a payout that is pending now). It lets the withdrawal saga of Chance be shown failing on purpose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestMode'
      responses:
        '200':
          description: The switches as they are now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /v1/events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Read an event and how far its delivery has got
      description: |
        For debugging: the event as it was (or will be) sent, plus the state of its delivery to the webhook URL.
        An event is forgotten together with its session or payout.
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '414':
          $ref: '#/components/responses/UriTooLong'

  /checkout/{id}:
    get:
      tags: [Payment page]
      operationId: showCheckoutPage
      summary: The payment page of a session
      description: |
        A small HTML page with the amount, the metadata and the buttons Pay and Decline (forms that post to
        `{id}/pay` and `{id}/decline`). Every value on it is escaped. The page loads nothing from outside
        (`Content-Security-Policy: default-src 'none'`). A session that is not open shows a page that says so,
        with the answer `409`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: The page of an open session
          content:
            text/html:
              schema:
                type: string
        '409':
          description: The session is completed, declined or expired; the page says which
          content:
            text/html:
              schema:
                type: string
        '404':
          description: No such session (it may have been forgotten after a restart)
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '414':
          $ref: '#/components/responses/UriTooLong'
  /checkout/{id}/pay:
    post:
      tags: [Payment page]
      operationId: payCheckout
      summary: The buyer pays
      description: |
        Completes an open session, queues `checkout.session.completed` and redirects the buyer to the `successUrl`
        of the session. A session that is not open answers with a page and `409`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '303':
          description: Paid; the browser goes on to the success URL
          headers:
            Location:
              description: The `successUrl` of the session
              schema:
                type: string
        '409':
          description: The session is completed, declined or expired; the page says which
          content:
            text/html:
              schema:
                type: string
        '404':
          description: No such session
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '414':
          $ref: '#/components/responses/UriTooLong'
  /checkout/{id}/decline:
    post:
      tags: [Payment page]
      operationId: declineCheckout
      summary: The buyer declines
      description: |
        Declines an open session, queues `checkout.session.declined` and redirects the buyer to the `cancelUrl`
        of the session. A session that is not open answers with a page and `409`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '303':
          description: Declined; the browser goes on to the cancel URL
          headers:
            Location:
              description: The `cancelUrl` of the session
              schema:
                type: string
        '409':
          description: The session is completed, declined or expired; the page says which
          content:
            text/html:
              schema:
                type: string
        '404':
          description: No such session
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '414':
          $ref: '#/components/responses/UriTooLong'

  /health/startup:
    get:
      tags: [Health]
      operationId: healthStartup
      summary: Startup probe
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Up'
        '5XX':
          $ref: '#/components/responses/ProbeFailed'
  /health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      summary: Readiness probe
      description: Answers `503` while the process shuts down, so that traffic stops before the server closes.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Up'
        '503':
          $ref: '#/components/responses/ProbeFailed'
  /health/live:
    get:
      tags: [Health]
      operationId: healthLive
      summary: Liveness probe
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Up'
        '5XX':
          $ref: '#/components/responses/ProbeFailed'

webhooks:
  providerEvent:
    post:
      operationId: receiveProviderEvent
      summary: An event, sent to WEBHOOK_URL
      description: |
        Sent for every change of a session or payout that the merchant did not make itself: the buyer paid or
        declined, the session expired, the payout was paid or failed. The body is the thin event below, sent as
        the exact text that was signed (`Provider-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">`).
        Any answer other than 2xx, a network error and a timeout of 5 seconds are retried with exponential
        backoff (1 s, doubled every time) for at most 8 attempts in all; then the event is given up. Events about
        one object are delivered one after the other, in the order they were created. Delivery is at least once:
        deduplicate by the event `id`. Redirects are not followed.
      security: []
      parameters:
        - name: Provider-Signature
          in: header
          required: true
          description: '`t=<unix seconds>,v1=<hex>`; the time is that of the attempt, so every retry has a fresh one'
          schema:
            type: string
            pattern: '^t=\d+,v1=[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '2XX':
          description: Received; the event is not sent again

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        The provider's API key (setting `PROVIDER_API_KEY`), sent as `Authorization: Bearer <key>`. There is one
        merchant and one key. The comparison takes the same time for every wrong key.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chosen by the caller, for example a UUID or the id of the deposit or withdrawal. Repeating a request with the
        same key and body returns the same object.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.:-]{1,255}$'
    ObjectId:
      name: id
      in: path
      required: true
      description: Id of the object
      schema:
        type: string
        minLength: 1
        maxLength: 64

  responses:
    BadRequest:
      description: The request is invalid; `errors` names the fields
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The API key is missing or wrong
      headers:
        WWW-Authenticate:
          description: Bearer challenge
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (also after a restart of the provider, which forgets everything)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The body is larger than 16 KiB; it is refused before it is read
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The body is not JSON (the `Content-Type` is not `application/json`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UriTooLong:
      description: A path segment is longer than 100 characters. An id of 65 to 100 characters is `400`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyConflict:
      description: The Idempotency-Key was used for a request with another body (code `idempotency_key_reused`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AtCapacity:
      description: |
        The provider holds as many sessions (or payouts) as it may and all of them are still open (or pending), so
        none can be dropped (code `capacity_exceeded`). Try again after the time in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before the request is repeated
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Up:
      description: Up
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    ProbeFailed:
      description: Not up
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference that identifies the problem type
          examples: ['urn:chance:payment-provider:problem:idempotency-key-reused']
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: The request path
        code:
          type: string
          description: Machine-readable problem code
          examples: [idempotency_key_reused]
        errors:
          type: array
          description: Invalid fields of a 400 answer
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up]
    Metadata:
      type: object
      description: Text to text, at most 10 keys; keys and values have at most 200 characters. The provider keeps it and shows it on the payment page.
      maxProperties: 10
      propertyNames:
        minLength: 1
        maxLength: 200
      additionalProperties:
        type: string
        maxLength: 200
      examples:
        - { depositId: 018f3c1e-7a00-7000-8000-000000000001, tenantId: 018f3c1e-7a00-7000-8000-0000000000aa }
    Amount:
      type: integer
      description: Cents, 1 to 1 000 000
      minimum: 1
      maximum: 1000000
    Currency:
      type: string
      enum: [EUR]
    CreateCheckoutSessionRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, successUrl, cancelUrl]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        metadata:
          $ref: '#/components/schemas/Metadata'
        successUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Where the buyer goes after paying; an http or https URL in printable ASCII, without a user name
        cancelUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Where the buyer goes after declining; same rules as successUrl
    CheckoutSession:
      type: object
      required: [id, object, url, status, amount, currency, metadata, successUrl, cancelUrl, createdAt, expiresAt]
      properties:
        id:
          type: string
          description: '"cs_" and 24 random base64url characters'
          pattern: '^cs_[A-Za-z0-9_-]{24}$'
        object:
          type: string
          enum: [checkout_session]
        url:
          type: string
          description: The payment page, PUBLIC_BASE_URL + /checkout/{id}
        status:
          type: string
          description: '`open` until the buyer pays or declines or the time is up; the other three states are final'
          enum: [open, completed, declined, expired]
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        metadata:
          $ref: '#/components/schemas/Metadata'
        successUrl:
          type: string
        cancelUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    CreatePayoutRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, destination]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        destination:
          type: string
          minLength: 1
          maxLength: 200
          description: The account the money goes to, as an id of the merchant's choice; no control characters
        metadata:
          $ref: '#/components/schemas/Metadata'
    Payout:
      type: object
      required: [id, object, status, amount, currency, destination, metadata, failureReason, createdAt, settledAt]
      properties:
        id:
          type: string
          description: '"po_" and 24 random base64url characters'
          pattern: '^po_[A-Za-z0-9_-]{24}$'
        object:
          type: string
          enum: [payout]
        status:
          type: string
          description: '`pending` until the delay is over; `paid` and `failed` are final'
          enum: [pending, paid, failed]
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        destination:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        failureReason:
          type: [string, 'null']
          description: '`declined` when the test mode declined the payout; otherwise null'
          enum: [declined, null]
        createdAt:
          type: string
          format: date-time
        settledAt:
          type: [string, 'null']
          format: date-time
          description: When the payout became paid or failed
    TestMode:
      type: object
      additionalProperties: false
      required: [declinePayouts]
      properties:
        declinePayouts:
          type: boolean
          description: When true, payouts that settle fail with the reason `declined`
    WebhookEvent:
      type: object
      description: |
        The body of a webhook. Thin on purpose: it names the object, and the receiver reads the object through the API.
        New fields may be added; a receiver ignores the ones it does not know.
      required: [id, type, created, data]
      properties:
        id:
          type: string
          description: '"evt_" and 24 random base64url characters; the same for every attempt to deliver this event'
          pattern: '^evt_[A-Za-z0-9_-]{24}$'
        type:
          type: string
          enum:
            - checkout.session.completed
            - checkout.session.declined
            - checkout.session.expired
            - payout.paid
            - payout.failed
        created:
          type: string
          format: date-time
        data:
          type: object
          required: [object, id]
          properties:
            object:
              type: string
              enum: [checkout_session, payout]
            id:
              type: string
              description: The id of the session or payout
    EventDetails:
      description: An event with the state of its delivery
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - type: object
          required: [delivery]
          properties:
            delivery:
              type: object
              required: [status, attempts, lastStatus, lastError, lastAttemptAt, nextAttemptAt]
              properties:
                status:
                  type: string
                  description: '`pending` while it is tried or waits for a retry; `delivered` after a 2xx answer; `failed` after the last attempt'
                  enum: [pending, delivered, failed]
                attempts:
                  type: integer
                lastStatus:
                  type: [integer, 'null']
                  description: The HTTP status of the last attempt, null if there was none or it got no answer
                lastError:
                  type: [string, 'null']
                  description: A short word for the failure of the last attempt when it got no answer, for example `TimeoutError`
                lastAttemptAt:
                  type: [string, 'null']
                  format: date-time
                nextAttemptAt:
                  type: [string, 'null']
                  format: date-time
